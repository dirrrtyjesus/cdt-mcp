[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cdt-mcp"
version = "0.1.0"
description = "Coherence Data Types (CDTs) as a Model Context Protocol server: multi-agent state synchronization by wave superposition."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "augerd (dirrrtyjesus)" }]
keywords = ["mcp", "model-context-protocol", "claude", "multi-agent", "crdt", "cdt", "coherence", "fhp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "mcp>=2,<3",
  "numpy>=1.26",
  "pydantic>=2.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
cdt-mcp = "cdt_mcp.server:main"

[project.urls]
Homepage = "https://github.com/dirrrtyjesus/cdt-mcp"
Repository = "https://github.com/dirrrtyjesus/cdt-mcp"
Issues = "https://github.com/dirrrtyjesus/cdt-mcp/issues"
Theory = "https://github.com/dirrrtyjesus/fhp-computing"

[tool.hatch.build.targets.wheel]
packages = ["src/cdt_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# numpy's stubs use PEP 695 syntax; check with the running interpreter's version.
strict = true
ignore_missing_imports = true
